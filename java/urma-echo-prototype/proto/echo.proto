syntax = "proto2";
package benchmark;
option cc_generic_services = true;

message EchoRequest {
  required uint64 sequence = 1;
  required bytes payload = 2;
}
message EchoResponse {
  required uint64 sequence = 1;
  required bytes payload = 2;
}
service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse);
}
